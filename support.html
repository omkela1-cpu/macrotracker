<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support | MacroTracker</title>
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #111; --muted: #6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 28px 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); }
  main { max-width: 640px; }
  h2 { font-size: 17px; margin: 22px 0 6px; }
  p, li { color: var(--text); }
  ul { padding-left: 20px; margin: 6px 0; }
  li { margin: 4px 0; }
  .muted { color: var(--muted); }
  a { color: #8a1c33; }
  @media (prefers-color-scheme: dark) { a { color: #e07a8e; } }
</style>
</head>
<body>
<main>
  <h1>MacroTracker support</h1>
  <p>For help or to report a problem, email <a href="mailto:omkela1@gmail.com">omkela1@gmail.com</a>.</p>
  <p>To delete your account: in the app, go to You &gt; Account &gt; Delete account.</p>
  <p class="muted"><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
